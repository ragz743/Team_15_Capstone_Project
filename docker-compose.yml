services:
  pgvector:
    build:
      context: .
      dockerfile: deployment/Dockerfile.pgvector # run stuff using this file
    container_name: pgvector
    ports:
      - "5432:5432" # use pg default port
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: vectorstore
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql # persist data here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PG_USER} -d vectorstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    container_name: api
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      PG_HOST: pgvector
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL}
      OPENROUTER_CHAT_TEMPERATURE: ${OPENROUTER_CHAT_TEMPERATURE}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL}
    ports:
      - "8000:8000" # exposed for debugging; nginx proxies internally

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: frontend
    depends_on:
      - api
    ports:
      - "8080:80" # client opens http://localhost:8080

  embedding-model:
    build:
      context: .
      dockerfile: deployment/Dockerfile.llama-server
      args:
        - GGUF_FILE=models/${EMBEDDING_MODEL}
    profiles:
      - local_llm
    container_name: embedding
    environment:
      - LLAMA_ARG_MODEL=models/${EMBEDDING_MODEL}
      - LLAMA_ARG_CTX_SIZE=4096 # note any llama-cpp args can be passed with
      - LLAMA_ARG_HOST=0.0.0.0  # format 'LLAMA_ARG_<flag-name>'
      - LLAMA_ARG_PORT=8081
    ports:
      - "8081:8081"
    volumes:
      - models:/models
    restart: unless-stopped

  chatbot-model:
    build:
      context: .
      dockerfile: deployment/Dockerfile.llama-server
      args:
        - GGUF_FILE=models/${CHATBOT_MODEL}
    profiles:
      - local_llm
    container_name: chatbot
    environment:
      - LLAMA_ARG_MODEL=models/${CHATBOT_MODEL}
      - LLAMA_ARG_CTX_SIZE=4096
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8082
    ports:
      - "8082:8082"
    volumes:
      - models:/models
    restart: unless-stopped

volumes:
  pgdata:
  models:
