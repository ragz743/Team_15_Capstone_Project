# Sample questions for the retrieval quality check (python -m scripts.evaluate_retrieval).
#
# Each question is asked at its station through the LangGraph weather workflow, and passes when the
# workflow queries the expected kind of data and gets records back. Keep the sample small: every question
# makes about three chat model requests (classifier, SQL, summary).
#
# source: current (current_weather) | historical (historical_weather) | forecast (forecast_weather)
# station: an active AWN station name, as listed by Browse stations; the workflow answers one station
# at a time, so there are no county-wide questions
#
# Update the list when stations are added or retired.

samples:
  - question: What is the temperature in Pullman right now?
    source: current
    station: Pullman
  - question: How windy is it at Fairfield at the moment?
    source: current
    station: Fairfield
  - question: What is the current humidity at Orondo?
    source: current
    station: Orondo
  - question: Is it raining in LaCrosse right now?
    source: current
    station: LaCrosse
  - question: What was the high temperature in Pullman yesterday?
    source: historical
    station: Pullman
  - question: How much rain fell at Green Bluff over the last week?
    source: historical
    station: Green Bluff
  - question: What were the low temperatures at Mansfield this week?
    source: historical
    station: Mansfield
  - question: What was the average temperature at Wenatchee over the past three days?
    source: historical
    station: Wenatchee
  - question: Will it rain in Pullman in the next 24 hours?
    source: forecast
    station: Pullman
  - question: What is the forecast high for Waterville tomorrow?
    source: forecast
    station: Waterville
  - question: Is frost expected at Sunrise tonight?
    source: forecast
    station: Sunrise
  - question: What is the wind forecast for Prosser tomorrow?
    source: forecast
    station: Prosser
